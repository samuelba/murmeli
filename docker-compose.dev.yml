services:
  postgres:
    image: postgres:18-alpine
    container_name: murmeli-dev-postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: murmeli
      POSTGRES_PASSWORD: murmeli
      POSTGRES_DB: murmeli
    volumes:
      - murmeli_dev_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murmeli -d murmeli"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    container_name: murmeli-dev-redis
    command: ["valkey-server", "--requirepass", "devpassword"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a devpassword --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: murmeli-dev-mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  murmeli_dev_postgres_data:
