name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.x

jobs:
  repo:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test repo scripts
        run: npm run scripts:test
      - name: Inline Postgres init script matches backend copy
        run: npm run check:compose-init
      - name: No ß in Swiss German
        run: npm run check:eszett
      - name: Environment variables are documented
        run: npm run docs:check
      - name: Validate compose files
        env:
          POSTGRES_PASSWORD: ci-placeholder
          POSTGRES_APP_PASSWORD: ci-placeholder
          REDIS_PASSWORD: ci-placeholder
          JWT_SECRET: ci-placeholder
          ENCRYPTION_KEY: ci-placeholder
          ALTCHA_HMAC_KEY: ci-placeholder
          APP_URL: https://murmeli.example.com
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.dev.yml config -q

  content:
    name: Content
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: content/package-lock.json
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npm run test:cov
      - run: npm run test:cjs

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            content/package-lock.json
      - run: npm install -g npm@12.0.2
      - name: Build the content package
        working-directory: content
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:cov
      - run: npm audit --omit=dev --audit-level=high
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  backend-e2e:
    name: Backend E2E (Postgres + Valkey)
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: murmeli
          POSTGRES_PASSWORD: murmeli
          POSTGRES_DB: murmeli
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U murmeli -d murmeli"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports: ["1025:1025", "8025:8025"]
    env:
      E2E_DB: "1"
      NODE_ENV: test
      APP_URL: http://localhost:4200
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: murmeli_app
      DATABASE_PASSWORD: murmeli_app
      DATABASE_NAME: murmeli
      DB_MIGRATION_USERNAME: murmeli
      DB_MIGRATION_PASSWORD: murmeli
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: "Murmeli <no-reply@murmeli.test>"
      MAILPIT_URL: http://localhost:8025
      REGISTRATION_ENABLED: "false"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-0123456789abcdef
      ENCRYPTION_KEY: ci-only-encryption-key-that-is-long-enough-0123456789
      ALTCHA_HMAC_KEY: ci-only-altcha-hmac-key-that-is-long-enough-012345
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            content/package-lock.json
      - run: npm install -g npm@12.0.2
      - name: Build the content package
        working-directory: content
        run: npm ci && npm run build
      - run: npm ci
      - name: Create the least-privileged runtime role
        env:
          PGHOST: localhost
          PGPASSWORD: murmeli
          POSTGRES_USER: murmeli
          POSTGRES_DB: murmeli
          POSTGRES_APP_USER: murmeli_app
          POSTGRES_APP_PASSWORD: murmeli_app
        run: sh docker/postgres-init/10-app-role.sh
      - run: npm run test:e2e
      - name: Entities match migrations
        run: npm run migration:generate -- --check src/migrations/Drift

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            content/package-lock.json
      - run: npm install -g npm@12.0.2
      - name: Build the content package
        working-directory: content
        run: npm ci && npm run build
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            content/package-lock.json
      - run: npm install -g npm@12.0.2
      - name: Build the content package
        working-directory: content
        run: npm ci && npm run build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  images:
    name: Image build + scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          target: production
          load: true
          tags: murmeli-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: murmeli-${{ matrix.component }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
