x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    image: postgres:18-alpine
    container_name: murmeli-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-murmeli_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-murmeli}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-murmeli_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    configs:
      - source: postgres_app_role
        target: /docker-entrypoint-initdb.d/10-app-role.sh
        mode: 0555
    volumes:
      - murmeli_postgres_data:/var/lib/postgresql
    networks:
      - murmeli
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *hardening
    image: valkey/valkey:8-alpine
    container_name: murmeli-redis
    command: ["sh", "-c", "exec valkey-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - murmeli_redis_data:/data
    networks:
      - murmeli
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *hardening
    build:
      context: ./backend
      target: production
    image: ghcr.io/samuelba/kids-learning/murmeli-backend:${MURMELI_VERSION:-latest}
    container_name: murmeli-backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      APP_URL: ${APP_URL:?set APP_URL in .env (public URL, e.g. https://murmeli.example.com)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}

      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRES_APP_USER:-murmeli_app}
      DATABASE_PASSWORD: ${POSTGRES_APP_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB:-murmeli}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DB_MIGRATION_USERNAME: ${POSTGRES_USER:-murmeli_owner}
      DB_MIGRATION_PASSWORD: ${POSTGRES_PASSWORD}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-30d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -base64 48)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?set ALTCHA_HMAC_KEY in .env (openssl rand -base64 48)}
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS:-60}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-120}
      RATE_LIMIT_AUTH_TTL_SECONDS: ${RATE_LIMIT_AUTH_TTL_SECONDS:-300}
      RATE_LIMIT_AUTH_LIMIT: ${RATE_LIMIT_AUTH_LIMIT:-10}
      RATE_LIMIT_EMAIL_TTL_SECONDS: ${RATE_LIMIT_EMAIL_TTL_SECONDS:-3600}
      RATE_LIMIT_EMAIL_LIMIT: ${RATE_LIMIT_EMAIL_LIMIT:-5}
      RATE_LIMIT_LOGIN_ACCOUNT_LIMIT: ${RATE_LIMIT_LOGIN_ACCOUNT_LIMIT:-5}
      RATE_LIMIT_LOGIN_ACCOUNT_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_ACCOUNT_WINDOW_SECONDS:-300}
      RATE_LIMIT_LOGIN_ACCOUNT_LOCK_SECONDS: ${RATE_LIMIT_LOGIN_ACCOUNT_LOCK_SECONDS:-900}
      RATE_LIMIT_PARENT_GATE_LIMIT: ${RATE_LIMIT_PARENT_GATE_LIMIT:-5}
      RATE_LIMIT_PARENT_GATE_WINDOW_SECONDS: ${RATE_LIMIT_PARENT_GATE_WINDOW_SECONDS:-300}
      RATE_LIMIT_TOTP_ATTEMPTS: ${RATE_LIMIT_TOTP_ATTEMPTS:-5}
      RATE_LIMIT_KID_PIN_LIMIT: ${RATE_LIMIT_KID_PIN_LIMIT:-5}
      RATE_LIMIT_KID_PIN_WINDOW_SECONDS: ${RATE_LIMIT_KID_PIN_WINDOW_SECONDS:-900}
      RATE_LIMIT_LOGIN_EMAIL_LIMIT: ${RATE_LIMIT_LOGIN_EMAIL_LIMIT:-50}
      RATE_LIMIT_LOGIN_EMAIL_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_EMAIL_WINDOW_SECONDS:-3600}
      RATE_LIMIT_TOTP_USER_LIMIT: ${RATE_LIMIT_TOTP_USER_LIMIT:-10}
      RATE_LIMIT_TOTP_USER_WINDOW_SECONDS: ${RATE_LIMIT_TOTP_USER_WINDOW_SECONDS:-900}
      RATE_LIMIT_EMAIL_RECIPIENT_LIMIT: ${RATE_LIMIT_EMAIL_RECIPIENT_LIMIT:-3}
      PASSWORD_HIBP_CHECK: ${PASSWORD_HIBP_CHECK:-false}
      SETUP_TOKEN: ${SETUP_TOKEN:-}

      BACKUP_DIR: /app/backups
      BACKUP_MANDATORY: ${BACKUP_MANDATORY:-true}
      BACKUP_KEEP_COUNT: ${BACKUP_KEEP_COUNT:-10}
      BACKUP_MAX_AGE_DAYS: ${BACKUP_MAX_AGE_DAYS:-30}
    volumes:
      - murmeli_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - murmeli

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      target: production
    image: ghcr.io/samuelba/kids-learning/murmeli-frontend:${MURMELI_VERSION:-latest}
    container_name: murmeli-frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
      HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      NGINX_RESOLVER: ${NGINX_RESOLVER:-}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - murmeli

configs:
  # Same as backend/docker/postgres-init/10-app-role.sh (kept in sync by scripts/check-compose-init.mjs).
  # Runs once, on an empty data volume.
  postgres_app_role:
    content: |
      #!/bin/sh
      # Creates the least-privileged runtime role for the backend. Runs once from
      # /docker-entrypoint-initdb.d of the official postgres image, as POSTGRES_USER,
      # which owns the schema and runs the migrations. The migrations narrow the
      # default grants further: the role may only UPDATE the anonymisable columns of
      # audit_log (actor_id, ip, target_id).
      set -eu

      : "$${POSTGRES_APP_USER:?POSTGRES_APP_USER must be set}"
      : "$${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}"

      psql -v ON_ERROR_STOP=1 \
        --username "$$POSTGRES_USER" \
        --dbname "$$POSTGRES_DB" \
        --set app_user="$$POSTGRES_APP_USER" \
        --set app_password="$$POSTGRES_APP_PASSWORD" \
        --set owner="$$POSTGRES_USER" \
        --set db="$$POSTGRES_DB" <<'SQL'
      CREATE ROLE :"app_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
        PASSWORD :'app_password';
      ALTER ROLE :"app_user" SET statement_timeout = '15s';
      ALTER ROLE :"app_user" SET idle_in_transaction_session_timeout = '30s';

      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      GRANT CONNECT ON DATABASE :"db" TO :"app_user";
      GRANT USAGE ON SCHEMA public TO :"app_user";

      ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO :"app_user";
      ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO :"app_user";
      ALTER DEFAULT PRIVILEGES FOR ROLE :"owner" IN SCHEMA public
        GRANT EXECUTE ON FUNCTIONS TO :"app_user";
      SQL

networks:
  murmeli:

volumes:
  murmeli_postgres_data:
  murmeli_redis_data:
  murmeli_backups:
