[project]
name = "murmeli-audio"
version = "0.1.0"
description = "Offline TTS pipeline that renders the narrator clips for the learning app"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
qwen = [
  "qwen-tts==0.1.1",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "soundfile==0.13.1",
  "huggingface-hub==0.36.0",
]
asr = ["faster-whisper==1.2.1", "av==15.1.0"]
piper = ["piper-tts==1.8.0"]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[project.scripts]
murmeli-audio = "murmeli_audio.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["murmeli_audio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=murmeli_audio --cov-report=term-missing"

[tool.coverage.run]
omit = [
  "murmeli_audio/engines/qwen3.py",
  "murmeli_audio/engines/piper.py",
  "murmeli_audio/voice_design.py",
  "murmeli_audio/asr.py",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]

[tool.ruff.lint.per-file-ignores]
"murmeli_audio/review.py" = ["E501"]
