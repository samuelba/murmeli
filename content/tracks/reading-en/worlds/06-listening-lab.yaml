# Listening Lab: hear a CVC word (no picture) and build it from letter tiles, in phonics order.
id: reading-en-listening-lab
order: 6
grade: '1'
requires: [reading-en-word-workshop]
title: { en-US: Listening Lab }
scene: workshop
skills:
  - { id: en.spell.dictation, ccss: L.K.2d, title: { en-US: Spelling words you hear } }
  - { id: en.spell.extra, ccss: L.K.2d, title: { en-US: Spelling with extra letters } }
levels:
  - id: reading-en-listening-lab-01
    title: { en-US: "Cat, map and cap" }
    skill: en.spell.dictation
    items: 6
    passRatio: 0.8
    demo:
      exercise: { type: listen-write, params: { words: [cat], maxLength: 4 } }
      target: cat
      steps:
        - say: { en-US: "Listen: cat." }
          action: { highlight: prompt }
        - say: { en-US: "I say the word slowly and pick one letter for each sound." }
          action: { placeTiles: true }
        - say: { en-US: "Done! It says cat." }
          action: { highlight: tiles }
    generators:
      - { type: listen-write, weight: 1, params: { words: [cat, map, cap], extraTiles: 0, maxLength: 4 } }

  - id: reading-en-listening-lab-02
    title: { en-US: "Dog, pig and ant" }
