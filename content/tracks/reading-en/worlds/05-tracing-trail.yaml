# Tracing Trail: trace letters in the phonics order (s a t p i n, m d g o c k, e u r h b f l, ...), small letters first.
id: reading-en-tracing-trail
order: 5
grade: '1'
requires: [reading-en-sound-garden]
title: { en-US: Tracing Trail }
scene: forest
skills:
  - { id: en.write.lower, ccss: L.K.1a, title: { en-US: Writing small letters } }
  - { id: en.write.upper, ccss: L.K.1a, title: { en-US: Writing capital letters } }
levels:
  - id: reading-en-tracing-trail-01
    title: { en-US: "s, a, t and p" }
    skill: en.write.lower
    items: 6
    passRatio: 0.8
    demo:
      exercise: { type: trace-letter, params: { letters: [s], tolerance: 1.3 } }
      target: s
      steps:
        - say: { en-US: "Look, this is how I write s." }
          action: { highlight: canvas }
        - say: { en-US: "I start at the dot and follow the arrow." }
          action: { trace: true }
        - say: { en-US: "Now it's your turn. Go slowly on the line." }
          action: { highlight: canvas }
    generators:
      - { type: trace-letter, weight: 2, params: { letters: [s, a, t, p], tolerance: 1.3 } }

  - id: reading-en-tracing-trail-02
