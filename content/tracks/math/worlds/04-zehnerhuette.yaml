# Zehnerhütte: structured quantities (ten-frame, twenty-frame) and number bonds (Zahlenhaus) to 10.
# Comes before the Plus Bridge: seeing 5 + 2 at a glance and splitting numbers are the basis of
# addition strategies.
id: math-zehnerhuette
order: 4
grade: '1'
requires: [math-zahlenbach]
title: { de-CH: Zehnerhütte, en-US: Ten Hut }
scene: hut
skills:
  - id: math.tenframe.to20
    lp21: MA.1.C.1
    title: { de-CH: Zehnerfeld und Zwanzigerfeld, en-US: Ten-frame and twenty-frame }
  - id: math.bonds.to10
    lp21: MA.1.B.1
    title: { de-CH: Zahlen zerlegen bis 10, en-US: Number bonds to 10 }
levels:
  - id: math-zehnerhuette-01
    title: { de-CH: Das Zehnerfeld, en-US: The Ten-Frame }
    skill: math.tenframe.to20
    items: 6
    passRatio: 0.8
    demo:
      exercise: { type: ten-frame, params: { min: 3, max: 3 } }
      target: 3
      steps:
        - say: { de-CH: "Das ist ein Zehnerfeld. Es hat Platz für zehn Punkte.", en-US: "This is a ten-frame. It has room for ten dots." }
          action: { highlight: frame }
        - say: { de-CH: "Ich zähle die Punkte: eins, zwei, drei.", en-US: "I count the dots: one, two, three." }
          action: { countAlong: true }
        - say: { de-CH: "Es sind drei!", en-US: "There are three!" }
          action: { tapAnswer: true }
    generators:
      - { type: ten-frame, weight: 1, params: { min: 1, max: 10 } }

  - id: math-zehnerhuette-02
    title: { de-CH: Die Kraft der Fünf, en-US: The Power of Five }
    skill: math.tenframe.to20
    items: 6
    passRatio: 0.8
    demo:
      exercise: { type: ten-frame, params: { min: 7, max: 7 } }
      target: 7
      steps:
        - say: { de-CH: "Die obere Reihe ist voll. Das sind fünf.", en-US: "The top row is full. That is five." }
          action: { highlight: frame }
        - say: { de-CH: "Unten sind noch zwei. Fünf und zwei sind sieben.", en-US: "There are two more below. Five and two make seven." }
          action: { countAlong: true }
        - say: { de-CH: "Ich muss nicht alle zählen. Es sind sieben!", en-US: "I don't have to count them all. There are seven!" }
          action: { tapAnswer: true }
    generators:
      - { type: ten-frame, weight: 2, params: { min: 5, max: 10 } }
      - { type: ten-frame, weight: 1, params: { min: 1, max: 10, answerMode: keypad } }

  - id: math-zehnerhuette-03
    title: { de-CH: Das Zwanzigerfeld, en-US: The Twenty-Frame }
    skill: math.tenframe.to20
    items: 8
    passRatio: 0.8
    demo:
      exercise: { type: ten-frame, params: { min: 13, max: 13, frame: 20 } }
      target: 13
      steps:
        - say: { de-CH: "Das erste Zehnerfeld ist voll. Das sind zehn.", en-US: "The first ten-frame is full. That is ten." }
          action: { highlight: frame }
        - say: { de-CH: "Im zweiten sind drei. Zehn und drei sind dreizehn.", en-US: "The second one has three. Ten and three make thirteen." }
          action: { countAlong: true }
        - say: { de-CH: "Es sind dreizehn!", en-US: "There are thirteen!" }
          action: { tapAnswer: true }
    generators:
      - { type: ten-frame, weight: 1, params: { min: 10, max: 20, frame: 20, choices: 4 } }
      - { type: ten-frame, weight: 1, params: { min: 1, max: 20, frame: 20, answerMode: keypad } }

  - id: math-zehnerhuette-04
    title: { de-CH: Zahlenhaus bis 5, en-US: Number House to 5 }
    skill: math.bonds.to10
    items: 6
    passRatio: 0.8
    demo:
      exercise: { type: number-bond, params: { min: 5, max: 5, representation: dots } }
      steps:
        - say: { de-CH: "Im Dach wohnt die Fünf.", en-US: "Five lives in the roof." }
          action: { highlight: house }
        - say: { de-CH: "Unten wohnen zwei Zahlen. Zusammen sind sie fünf.", en-US: "Two numbers live below. Together they make five." }
          action: { countAlong: true }
        - say: { de-CH: "Ich finde die fehlende Zahl.", en-US: "I find the missing number." }
          action: { fillBlank: true }
    generators:
      - { type: number-bond, weight: 1, params: { min: 2, max: 5, representation: dots } }

  - id: math-zehnerhuette-05
    title: { de-CH: Zahlenhaus bis 10, en-US: Number House to 10 }
    skill: math.bonds.to10
    items: 8
    passRatio: 0.8
    demo:
      exercise: { type: number-bond, params: { min: 8, max: 8 } }
      steps:
        - say: { de-CH: "Im Dach steht die Acht. Unten fehlt eine Zahl.", en-US: "Eight is in the roof. One number below is missing." }
          action: { highlight: house }
        - say: { de-CH: "Ich zähle von der unteren Zahl weiter bis acht.", en-US: "I count on from the number below up to eight." }
          action: { countAlong: true }
        - say: { de-CH: "So viele Schritte fehlen. Das ist die Zahl!", en-US: "That many steps are missing. That is the number!" }
          action: { fillBlank: true }
    generators:
      - { type: number-bond, weight: 2, params: { min: 6, max: 10 } }
      - { type: number-bond, weight: 1, params: { min: 2, max: 10, missing: mixed } }

  - id: math-zehnerhuette-06
    title: { de-CH: Ganze Zahlenhäuser, en-US: Whole Number Houses }
    skill: math.bonds.to10
    items: 6
    passRatio: 0.8
    demo:
      exercise: { type: number-bond, params: { min: 6, max: 6, rows: 3 } }
      steps:
        - say: { de-CH: "Dieses Haus hat drei Stockwerke.", en-US: "This house has three floors." }
          action: { highlight: house }
        - say: { de-CH: "In jedem Stockwerk sind zwei Zahlen. Zusammen sind sie immer sechs.", en-US: "Each floor has two numbers. Together they always make six." }
          action: { highlight: numbers }
        - say: { de-CH: "Ich fülle die leeren Fenster aus.", en-US: "I fill in the empty windows." }
          action: { fillBlank: true }
    generators:
      - { type: number-bond, weight: 1, params: { min: 5, max: 10, rows: 3 } }

  - id: math-zehnerhuette-07
    title: { de-CH: Zehnerfreunde, en-US: Friends of Ten }
    skill: math.bonds.to10
    items: 8
    passRatio: 0.8
    demo:
      exercise: { type: number-bond, params: { min: 10, max: 10 } }
      steps:
        - say: { de-CH: "Zehnerfreunde sind zwei Zahlen, die zusammen zehn sind.", en-US: "Friends of ten are two numbers that make ten together." }
          action: { highlight: house }
        - say: { de-CH: "Sieben und drei sind Zehnerfreunde.", en-US: "Seven and three are friends of ten." }
          action: { highlight: numbers }
        - say: { de-CH: "Ich finde den Zehnerfreund.", en-US: "I find the friend of ten." }
          action: { fillBlank: true }
    generators:
      - { type: number-bond, weight: 2, params: { min: 10, max: 10 } }
      - { type: number-bond, weight: 1, params: { min: 10, max: 10, rows: 4 } }
      - { type: ten-frame, weight: 1, params: { min: 1, max: 10, answerMode: keypad } }
