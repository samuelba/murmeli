# Hörwerkstatt: a light dictation. Hear a short regular word and build it from letter tiles (no picture).
id: reading-de-hoerwerkstatt
order: 7
grade: '1'
requires: [reading-de-woerterwerkstatt]
title: { de-CH: Hörwerkstatt }
scene: workshop
skills:
  - { id: de.write.dictation, lp21: D.5.E.1, title: { de-CH: Gehörte Wörter schreiben } }
  - { id: de.write.tiles, lp21: D.5.E.1, title: { de-CH: Wörter genau aufbauen } }
levels:
  - id: reading-de-hoerwerkstatt-01
    title: { de-CH: "Kurze Wörter" }
    skill: de.write.dictation
    items: 6
    passRatio: 0.8
    demo:
      exercise: { type: listen-write, params: { words: [watch], maxLength: 3 } }
      target: watch
      steps:
        - say: { de-CH: "Hör gut zu: Uhr." }
          action: { highlight: prompt }
        - say: { de-CH: "Ich spreche das Wort ganz langsam und suche Buchstabe für Buchstabe." }
          action: { placeTiles: true }
        - say: { de-CH: "Fertig! Da steht Uhr." }
          action: { highlight: tiles }
    generators:
      - { type: listen-write, weight: 1, params: { words: [egg, watch, ear], extraTiles: 0, maxLength: 3 } }

