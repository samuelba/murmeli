# Schreibwiese: tracing letters in Basisschrift-like print, in the Lautwiese order.
# Capital letters first, then small letters, then the umlauts.
id: reading-de-schreibwiese
order: 6
grade: '1'
requires: [reading-de-lautwiese]
title: { de-CH: Schreibwiese }
scene: meadow
skills:
  - { id: de.write.upper, lp21: D.4.A.1, title: { de-CH: Grosse Buchstaben schreiben } }
  - { id: de.write.lower, lp21: D.4.A.1, title: { de-CH: Kleine Buchstaben schreiben } }
levels:
  - id: reading-de-schreibwiese-01
    title: { de-CH: "A, M und I" }
    skill: de.write.upper
    items: 6
    passRatio: 0.8
    demo:
      exercise: { type: trace-letter, params: { letters: [A], tolerance: 1.3 } }
      target: A
      steps:
        - say: { de-CH: "Schau, so schreibe ich das A." }
          action: { highlight: canvas }
        - say: { de-CH: "Ich beginne beim Punkt und fahre dem Pfeil nach." }
          action: { trace: true }
        - say: { de-CH: "Jetzt bist du dran. Fahre langsam auf der Linie." }
          action: { highlight: canvas }
    generators:
      - { type: trace-letter, weight: 2, params: { letters: [A, M, I], tolerance: 1.3 } }

