# Buchstabenbach: the remaining letters and the first letter groups (Sch, Ei, Au, Eu, Ch, Ie).
# Picture pools leave out pictures with names that kids may say differently (e.g. Kleinbus, Holz, Karte).
id: reading-de-buchstabenbach
order: 3
grade: "1"
requires: [reading-de-silbenwald]
title: { de-CH: Buchstabenbach }
scene: brook
skills:
  - { id: de.letters.more, lp21: D.2.A.1, title: { de-CH: Weitere Buchstaben erkennen } }
  - { id: de.anlaut.more, lp21: D.1.A.1, title: { de-CH: Weitere Anlaute hören } }
  - { id: de.letters.groups, lp21: D.2.A.1, title: { de-CH: "Buchstabengruppen: Sch, Ei, Au" } }
levels:
  - id: reading-de-buchstabenbach-01
    title: { de-CH: "T, P und K" }
    skill: de.letters.more
    items: 8
    passRatio: 0.8
    demo:
      exercise: { type: initial-sound, params: { letters: [T], distractors: [M, S], pictures: [tiger], choices: 3 } }
      steps:
        - say: { de-CH: "Schau, ein Tiger!" }
          action: { highlight: picture }
        - say: { de-CH: "Tiger. Am Anfang höre ich T." }
          action: { highlight: letters }
        - say: { de-CH: "Ich tippe auf das T." }
          action: { tapAnswer: true }
    generators:
      - { type: letter-sound, weight: 1, params: { letters: [T, P, K], distractors: [M, S, L], choices: 3 } }
      - type: initial-sound
        weight: 1
        params:
          letters: [T, P, K]
          distractors: [M, S]
          pictures: [tomato, tiger, teddy, cup, mushroom, penguin, carrot, cake, cat, cow, chick]
          choices: 3

