          action: { highlight: prompt }
        - say: { de-CH: "Ich suche das H. Es sieht aus wie eine Leiter." }
          action: { highlight: choices }
        - say: { de-CH: "Da ist das H. Ich tippe drauf!" }
          action: { tapAnswer: true }
    generators:
      - { type: letter-sound, weight: 1, params: { letters: [H, B, W], distractors: [A, M, T], choices: 3 } }
      - type: initial-sound
